[package]
name = "lyys_mc_launcher"
version = "0.0.5-alpha"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = "3.5.2"
zip = "9.6.1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
open = "5.4"
gpui-kit = { version = "0.10.0", features = ["gpui-fast"] }
dioxus = { version = "0.7.10", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
    "launch",
    "native",
] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
smol = "2"
